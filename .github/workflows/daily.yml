name: daily-lesson

on:
  schedule:
    # 07:30 Asia/Shanghai = 23:30 UTC(前一天)
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "补发指定日期，格式 2026-11-01；留空=今天"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-lesson
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate lesson
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSH_WEBHOOK: ${{ secrets.PUSH_WEBHOOK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_DATE: ${{ inputs.date }}
        run: python daily.py

      - name: Commit site
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "lesson: $(date -u +%Y-%m-%d)"
          # 并发任务可能同时提交，先 rebase 再推，失败重试
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "retry $i failed, waiting..."; sleep $((i * 5))
          done
          echo "push failed after retries"; exit 1
