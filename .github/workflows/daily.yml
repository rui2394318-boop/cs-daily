name: daily-lesson

on:
  schedule:
    # GitHub 免费版定时实测延迟约 3 小时，
    # 所以提前到 20:00 UTC = 北京 04:00，即使延迟 3 小时也能在 07:00 前出稿。
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "补发指定日期，格式 2026-11-01；留空=今天"
        required: false
        default: ""
      news_only:
        description: "只重写每日新闻、不动学习包，填 1 生效"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-lesson
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate lesson
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSH_WEBHOOK: ${{ secrets.PUSH_WEBHOOK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_DATE: ${{ inputs.date }}
          NEWS_ONLY: ${{ inputs.news_only }}
        run: python daily.py

      - name: Commit site
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "lesson: $(date -u +%Y-%m-%d)"
          # 并发任务可能同时提交，先 rebase 再推，失败重试
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "retry $i failed, waiting..."; sleep $((i * 5))
          done
          echo "push failed after retries"; exit 1
