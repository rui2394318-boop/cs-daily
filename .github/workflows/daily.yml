name: daily-lesson

on:
  schedule:
    # 07:30 Asia/Shanghai = 23:30 UTC(前一天)
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "补发指定日期，格式 2026-11-01；留空=今天"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-lesson
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate lesson
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSH_WEBHOOK: ${{ secrets.PUSH_WEBHOOK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_DATE: ${{ inputs.date }}
        run: python daily.py

      - name: Commit site
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add docs
          git diff --quiet && git diff --staged --quiet || git commit -m "lesson: $(date -u +%Y-%m-%d)"
          git push
